<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Deep premium dark gradient -->
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#24252B"/>
      <stop offset="35%" stop-color="#16171B"/>
      <stop offset="100%" stop-color="#0B0C0E"/>
    </linearGradient>

    <!-- Subtle edge highlight for macOS depth -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#484A54" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1F2025" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Sleek curved gloss reflection -->
    <linearGradient id="gloss" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Standard macOS squircle tile -->
  <rect x="36" y="36" width="952" height="952" rx="224" fill="url(#bgDark)"/>
  <rect x="37.5" y="37.5" width="949" height="949" rx="222.5" fill="none" stroke="url(#borderGrad)" stroke-width="3"/>

  <!-- Top diagonal gloss reflection -->
  <path d="M 220 42 h 380 c 190 0 350 140 370 330 c -170 -60 -380 -50 -590 60 L 160 260 c 0 -120 90 -218 218 -218 Z" fill="url(#gloss)"/>

  <!-- Live Streaming Radio Broadcast Waves (White) -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round">
    <!-- Center Broadcasting Core -->
    <circle cx="512" cy="512" r="48" fill="#FFFFFF" stroke="none"/>

    <!-- Inner Wave Pair -->
    <!-- Left Inner -->
    <path d="M 425 409 A 135 135 0 0 0 425 615" stroke-width="42"/>
    <!-- Right Inner -->
    <path d="M 599 409 A 135 135 0 0 1 599 615" stroke-width="42"/>

    <!-- Middle Wave Pair -->
    <!-- Left Middle -->
    <path d="M 367 340 A 225 225 0 0 0 367 684" stroke-width="42"/>
    <!-- Right Middle -->
    <path d="M 657 340 A 225 225 0 0 1 657 684" stroke-width="42"/>

    <!-- Outer Wave Pair -->
    <!-- Left Outer -->
    <path d="M 310 271 A 315 315 0 0 0 310 753" stroke-width="42"/>
    <!-- Right Outer -->
    <path d="M 714 271 A 315 315 0 0 1 714 753" stroke-width="42"/>
  </g>
</svg>
